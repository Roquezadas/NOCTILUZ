<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><title>Comparação tipográfica — Noctiluz</title
  ><style>
    @font-face {
      font-family: Cormorant;
      src: url('../public/fonts/cormorant-garamond-latin-400-normal.woff2');
    }
    @font-face {
      font-family: EB;
      src: url('../public/fonts/eb-garamond-latin-400-normal.woff2');
    }
    body {
      background: #08090d;
      color: #f2eee8;
      margin: 50px;
      font-family: Arial;
    }
    article {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }
    h1 {
      font-size: 42px;
      font-weight: 400;
    }
    p {
      font-size: 26px;
      line-height: 1.7;
    }
    small {
      font: 13px Arial;
      color: #aaa6ae;
    }
    .a {
      font-family: Cormorant;
    }
    .b {
      font-family: EB;
    }
  </style>
  <article>
    <section class="a">
      <small>Cormorant Garamond</small>
      <h1>um jardim para<br />coisas não ditas.</h1>
      <p>na casa vazia,<br />a luz do corredor<br />ainda espera alguém.</p>
    </section>
    <section class="b">
      <small>EB Garamond</small>
      <h1>um jardim para<br />coisas não ditas.</h1>
      <p>na casa vazia,<br />a luz do corredor<br />ainda espera alguém.</p>
    </section>
  </article>
</html>
